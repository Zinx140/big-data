
name: project-bigdata

services:
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  hadoop-init:
    image: apache/hadoop:3.5.0
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        mkdir -p /hadoop-data/namenode
        mkdir -p /hadoop-data/datanode

        chown -R hadoop:hadoop /hadoop-data/namenode
        chown -R hadoop:hadoop /hadoop-data/datanode

        chmod 700 /hadoop-data/namenode
        chmod 700 /hadoop-data/datanode

        echo "Hadoop storage permissions initialized"
    volumes:
      - namenode_data:/hadoop-data/namenode
      - datanode_data:/hadoop-data/datanode
    restart: "no"

  namenode:
    image: apache/hadoop:3.5.0
    hostname: namenode
    user: hadoop
    command: ["hdfs", "namenode"]
    env_file:
      - ./hadoop/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name/current"
    depends_on:
      hadoop-init:
        condition: service_completed_successfully
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/tmp/hadoop-hadoop/dfs/name
      - ./data:/workspace/data
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.5.0
    hostname: datanode
    user: hadoop
    command: ["hdfs", "datanode"]
    env_file:
      - ./hadoop/hadoop.env
    depends_on:
      hadoop-init:
        condition: service_completed_successfully
      namenode:
        condition: service_started
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/tmp/hadoop-hadoop/dfs/data
    restart: unless-stopped

  resourcemanager:
    image: apache/hadoop:3.5.0
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    env_file:
      - ./hadoop/hadoop.env
    ports:
      - "8088:8088"
    restart: unless-stopped

  nodemanager:
    image: apache/hadoop:3.5.0
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    env_file:
      - ./hadoop/hadoop.env
    depends_on:
      - resourcemanager
    ports:
      - "8042:8042"
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.8-scala2.12-java17-python3-ubuntu
    hostname: spark-master
    user: root
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./jobs:/opt/spark/jobs
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.8-scala2.12-java17-python3-ubuntu
    hostname: spark-worker
    user: root
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - "2g"
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ./jobs:/opt/spark/jobs
    restart: unless-stopped

  hive:
    image: apache/hive:4.1.0
    hostname: hive
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dfs.defaultFS=hdfs://namenode:8020
        -Dhive.metastore.warehouse.dir=/user/hive/warehouse
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hive/conf:/hive_custom_conf:ro
      - hive_data:/opt/hive/data
    depends_on:
      namenode:
        condition: service_started
      datanode:
        condition: service_started
    restart: unless-stopped
  
  mongodb:
    image: mongo:8.0
    hostname: mongodb
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  kafka_data:
  namenode_data:
  datanode_data:
  hive_data:
  mongodb_data:
